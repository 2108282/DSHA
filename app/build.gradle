plugins {
    id 'com.android.application'
}

def offlineGz = file("src/main/assets/offline-rootfs.tar.gz")
def offlineBin = file("src/main/assets/offline-rootfs.bin")
if (!offlineGz.exists() && !offlineBin.exists()) {
    throw new GradleException(
        "缺少内置离线环境包 app/src/main/assets/offline-rootfs.tar.gz ——\n" +
        "它由 GitHub Actions 在 ubuntu-24.04-arm 上 chroot 预装生成。\n" +
        "本地构建请从 Actions 的 offline-rootfs-bundle 产物拷到该路径。")
}

// aapt 会把 .tar.gz 自动解压成 .tar。打进 APK 前改名为 .bin。
tasks.register("protectOfflineBundle") {
    doLast {
        if (offlineGz.exists()) {
            offlineBin.delete()
            if (!offlineGz.renameTo(offlineBin)) {
                throw new GradleException("无法把 offline-rootfs.tar.gz 改名为 .bin")
            }
        }
    }
}
tasks.configureEach { t ->
    if (t.name == "preBuild" || t.name == "preDebugBuild") {
        t.dependsOn("protectOfflineBundle")
    }
}

android {
    namespace 'com.deepseekharness.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.dsh.client"
        minSdk 26
        targetSdk 34
        versionCode 89
        versionName "1.1.8-rc2"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        debug {
            // APK 签名。**线上包实际用的不是 DSHA-release.keystore**：secret
            // DSHA_KEYSTORE_B64 里存的是一份 debug keystore（alias androiddebugkey，
            // 证书指纹 E7:E3:A3:1A:75:94:6F:26…），当初设 secret 时传错了文件，
            // v1.1.7 起发出去的包都是它签的。Android 只允许同签名覆盖安装，换密钥
            // 等于逼所有用户卸载重装（rootfs 在私有目录，卸载即丢），所以现在以线上
            // 实际密钥为准，密钥轮换（v3 rotation）单独排期。
            // 完整查证与三条路的取舍见工作区 DSHA-签名现状与风险.md。
            //
            // 用法：DSHA_KEYSTORE=/path/to/keystore
            //       DSHA_KEYSTORE_PASSWORD / DSHA_KEY_ALIAS / DSHA_KEY_PASSWORD
            //       （CI 走同名 secrets；本地 ./build.sh 会自动指向线上发布密钥）
            // 一个也没给时会退回 AGP 默认 debug keystore，并大声警告 —— 那种包每次
            // 构建的指纹都不同，装出去谁也升级不了，只能自己调试用。
            //
            // 另有一把**不同的**钥匙：DSHA-release.keystore（alias dsha，RSA 4096，
            // 指纹 ED:8A:AE:A2…）现在只用来签增量更新清单
            // （tools/sign-runtime-manifest.sh，公钥内置在 assets/runtime-update-pubkey.pem）。
            // 两把钥匙各管一件事，不要混用。
            def ksPath = System.getenv("DSHA_KEYSTORE") ?: project.findProperty("dsha.keystore")
            if (ksPath != null && !ksPath.toString().isEmpty() && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("DSHA_KEYSTORE_PASSWORD")
                        ?: project.findProperty("dsha.keystore.password") ?: ""
                keyAlias System.getenv("DSHA_KEY_ALIAS")
                        ?: project.findProperty("dsha.key.alias") ?: "dsha"
                keyPassword System.getenv("DSHA_KEY_PASSWORD")
                        ?: project.findProperty("dsha.key.password") ?: ""
                println "签名：release keystore ${ksPath}（alias=${keyAlias}）"
            } else {
                println "⚠️ 签名：未配置 DSHA_KEYSTORE，退回 debug keystore —— 仅供本地调试，" +
                        "不可用于发布（用户将无法覆盖升级）"
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            // 产物是对外发布的，不能让任意调试器附加上来（AGP 默认给 debug 构建
            // 加 android:debuggable="true"，这里显式关掉）
            debuggable false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            excludes += ['**/x86/**', '**/x86_64/**', '**/armeabi/**', '**/armeabi-v7a/**']
        }
    }

    androidResources {
        noCompress += ['gz', 'xz']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        aidl = true
        // AGP 8 默认不生成 BuildConfig；UpdateChecker 用它取版本号做 UA
        buildConfig = true
    }

    sourceSets {
        main {
            aidl.srcDirs = ['src/main/aidl']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // 代码里并不直接用 ConstraintLayout，但这行必须留着：material 1.11.0 传递依赖
    // constraintlayout 2.0.1，而本地 maven 缓存只有 2.1.4。删掉这行 → 离线构建直接
    // 报「No cached version of androidx.constraintlayout:constraintlayout:2.0.1」。
    // 也就是说它的作用是把传递依赖提升到已缓存的版本。（试删过，构建挂了才发现）
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'org.mozilla.geckoview:geckoview-arm64-v8a:126.0.20240526221752'
    debugImplementation 'com.github.L-JINBIN:MTDataFilesProvider:v1.0.0'
}

afterEvaluate {
    def verify = tasks.register("verifyArm64Apk") {
        doLast {
            def apk = file("build/outputs/apk/debug/app-debug.apk")
            if (!apk.isFile()) {
                throw new GradleException("找不到 " + apk)
            }
            def z = new java.util.zip.ZipFile(apk)
            def libs = []
            def assets = []
            z.entries().each { e ->
                if (e.name.startsWith("lib/") && e.name.endsWith(".so")) {
                    libs << e.name
                }
                if (e.name.contains("offline") || e.name.contains("rootfs") || e.name.startsWith("assets/")) {
                    assets << (e.name + " size=" + e.size)
                }
            }
            z.close()
            println "===== APK native libs ====="
            libs.each { println "  " + it }
            println "===== APK assets ====="
            assets.each { println "  " + it }
            def hasBundle = assets.any {
                it.contains("offline-rootfs") || it.contains("rootfs.tar") || it.contains("offline_rootfs")
            }
            if (!hasBundle) {
                throw new GradleException("APK 里没有 offline-rootfs。assets: " + assets)
            }
            if (libs.isEmpty()) {
                throw new GradleException("APK 里没有 lib/*.so")
            }
            if (!libs.any { it.startsWith("lib/arm64-v8a/") }) {
                throw new GradleException("APK 不含 lib/arm64-v8a/")
            }
            def bad = libs.findAll { !it.startsWith("lib/arm64-v8a/") }
            if (!bad.isEmpty()) {
                throw new GradleException("APK 混进了非 arm64 库: " + bad)
            }
        }
    }
    tasks.matching { it.name == "assembleDebug" }.configureEach {
        finalizedBy(verify)
    }
}
