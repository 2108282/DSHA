<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DSHA Native 控制中心</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-card: #182234;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.2);
            --red: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.2);
            --blue: #3b82f6;
            --blue-glow: rgba(59, 130, 246, 0.2);
            --radius: 14px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Noto Sans CJK SC", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 2px;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-title h1 {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .badge-ver {
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 20px;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            font-weight: 600;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
        }
        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--text-muted);
            transition: all 0.3s;
        }
        .dot.running {
            background-color: var(--green);
            box-shadow: 0 0 10px var(--green);
        }
        .dot.stopped {
            background-color: var(--red);
            box-shadow: 0 0 8px var(--red);
        }
        .status-text {
            font-size: 16px;
            font-weight: 600;
        }
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            background: var(--surface-card);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
        }
        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .meta-label {
            color: var(--text-muted);
            font-size: 11px;
        }
        .meta-value {
            font-family: monospace;
            font-weight: 600;
            color: #e2e8f0;
            word-break: break-all;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-group.single {
            grid-template-columns: 1fr;
        }
        button {
            border: none;
            outline: none;
            cursor: pointer;
            padding: 13px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.15s ease;
            user-select: none;
        }
        button:active {
            transform: scale(0.97);
        }
        .btn-start {
            background: #059669;
            color: #fff;
            box-shadow: 0 4px 14px var(--green-glow);
        }
        .btn-stop {
            background: #dc2626;
            color: #fff;
            box-shadow: 0 4px 14px var(--red-glow);
        }
        .btn-sec {
            background: #334155;
            color: #f1f5f9;
        }
        .btn-blue {
            background: #2563eb;
            color: #fff;
            box-shadow: 0 4px 14px var(--blue-glow);
        }
        .log-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .log-box {
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            height: 180px;
            overflow-y: auto;
            font-family: Consolas, Monaco, monospace;
            font-size: 11px;
            line-height: 1.5;
            color: #cbd5e1;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .footer-note {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: auto;
            padding-top: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <span style="font-size: 22px;">⚡</span>
            <h1>DSHA Native</h1>
            <span class="badge-ver">v1.2.0</span>
        </div>
        <div id="btnRefresh" style="cursor:pointer; font-size:18px; padding:4px;" title="刷新状态">🔄</div>
    </div>

    <!-- 核心状态卡片 -->
    <div class="card">
        <div class="status-row">
            <div class="status-indicator">
                <div id="statusDot" class="dot"></div>
                <span id="statusText" class="status-text">检测中...</span>
            </div>
            <span id="modeTag" style="font-size:12px; color:var(--text-muted);">极速 chroot 原生模式</span>
        </div>

        <div class="meta-grid">
            <div class="meta-item">
                <span class="meta-label">守护 PID</span>
                <span id="valPid" class="meta-value">-</span>
            </div>
            <div class="meta-item">
                <span class="meta-label">服务端口</span>
                <span id="valPort" class="meta-value">3088</span>
            </div>
            <div class="meta-item" style="grid-column: span 2;">
                <span class="meta-label">Bridge 鉴权 Token</span>
                <span id="valToken" class="meta-value">未获取</span>
            </div>
        </div>

        <div class="btn-group single" id="mainActionArea">
            <button id="btnToggle" class="btn-start">
                <span>▶</span> 启动核心服务
            </button>
        </div>

        <div class="btn-group">
            <button id="btnOpenWeb" class="btn-blue">
                <span>🌐</span> 打开 WebUI
            </button>
            <button id="btnOpenApp" class="btn-sec">
                <span>📱</span> 打开 DSHA App
            </button>
        </div>
    </div>

    <!-- 运行日志卡片 -->
    <div class="card" style="flex:1;">
        <div class="log-header">
            <span>实时控制台输出</span>
            <span id="logStatus" style="font-weight:normal; font-size:11px;">自动同步中</span>
        </div>
        <div id="logBox" class="log-box">正在连接 KernelSU / APatch 运行时环境...</div>
    </div>

    <div class="footer-note">
        DSHA Native · 0 虚拟化损耗 · 按需启停 · 0 待机偷跑
    </div>

    <script>
        // 兼容 KernelSU 与 APatch JS 桥接口
        if (window.apatch !== undefined && window.ksu === undefined) {
            window.ksu = window.apatch;
        }

        let isRunning = false;
        let currentPid = null;
        let currentPort = 3088;
        let currentUrl = "";

        async function runSuCmd(cmd) {
            if (!window.ksu) {
                return { errno: -1, stdout: "", stderr: "未检测到 ksu 环境（请在 KernelSU/APatch 管理器中打开）" };
            }
            try {
                // 优先通过 su -mm 穿透宿主挂载命名空间
                return await ksu.exec(`su -mm -c "${cmd.replace(/"/g, '\\"')}"`);
            } catch (err) {
                return { errno: -1, stdout: "", stderr: String(err) };
            }
        }

        function appendLog(text) {
            const box = document.getElementById("logBox");
            box.textContent += (box.textContent ? "\n" : "") + text;
            box.scrollTop = box.scrollHeight;
        }

        async function updateStatus() {
            if (!window.ksu) {
                document.getElementById("statusDot").className = "dot";
                document.getElementById("statusText").innerText = "独立调试模式";
                document.getElementById("logBox").textContent = "提示: 当前未在 KernelSU / APatch 内置 WebView 中运行。";
                return;
            }

            const res = await runSuCmd("/data/adb/dsha/scripts/status.sh");
            const stdout = res.stdout || "";
            
            if (stdout.includes("STATUS:RUNNING")) {
                isRunning = true;
                const pidMatch = stdout.match(/PID:(\d+)/);
                const portMatch = stdout.match(/PORT:(\d+)/);
                const urlMatch = stdout.match(/URL:(https?:\/\/[^\s]+)/);
                const tokenMatch = stdout.match(/BRIDGE_TOKEN:([^\s]+)/);

                currentPid = pidMatch ? pidMatch[1] : "-";
                currentPort = portMatch ? parseInt(portMatch[1], 10) : 3088;
                currentUrl = urlMatch ? urlMatch[1] : `http://127.0.0.1:${currentPort}/`;

                document.getElementById("statusDot").className = "dot running";
                document.getElementById("statusText").innerText = "运行中";
                document.getElementById("statusText").style.color = "var(--green)";
                document.getElementById("valPid").innerText = currentPid;
                document.getElementById("valPort").innerText = currentPort;
                document.getElementById("valToken").innerText = tokenMatch ? tokenMatch[1] : "已加载";

                const btn = document.getElementById("btnToggle");
                btn.className = "btn-stop";
                btn.innerHTML = "<span>⏹</span> 停止核心服务";
            } else {
                isRunning = false;
                currentPid = null;
                document.getElementById("statusDot").className = "dot stopped";
                document.getElementById("statusText").innerText = "已停止";
                document.getElementById("statusText").style.color = "var(--red)";
                document.getElementById("valPid").innerText = "-";
                document.getElementById("valToken").innerText = "-";

                const btn = document.getElementById("btnToggle");
                btn.className = "btn-start";
                btn.innerHTML = "<span>▶</span> 启动核心服务";
            }

            // 同步日志后 30 行
            const logRes = await runSuCmd("tail -n 30 /data/adb/dsha/run/dsh-web.log 2>/dev/null");
            if (logRes.stdout) {
                document.getElementById("logBox").textContent = logRes.stdout;
                document.getElementById("logBox").scrollTop = document.getElementById("logBox").scrollHeight;
            }
        }

        document.getElementById("btnToggle").addEventListener("click", async () => {
            const btn = document.getElementById("btnToggle");
            btn.disabled = true;
            if (isRunning) {
                appendLog("[操作] 正在停止 DSHA 核心服务...");
                btn.innerText = "正在停止...";
                await runSuCmd("/data/adb/dsha/scripts/stop.sh");
                appendLog("[结果] 服务已平稳停止。");
            } else {
                appendLog(`[操作] 正在拉起 DSHA 核心服务 (端口: ${currentPort})...`);
                btn.innerText = "正在拉起...";
                const res = await runSuCmd(`/data/adb/dsha/scripts/start.sh ${currentPort}`);
                appendLog(res.stdout || res.stderr || "[就绪]");
            }
            btn.disabled = false;
            await updateStatus();
        });

        document.getElementById("btnOpenWeb").addEventListener("click", async () => {
            if (!currentUrl) {
                currentUrl = `http://127.0.0.1:${currentPort}/`;
            }
            await runSuCmd(`am start -a android.intent.action.VIEW -d "${currentUrl}"`);
        });

        document.getElementById("btnOpenApp").addEventListener("click", async () => {
            await runSuCmd("am start -n com.dsha.fr/com.deepseekharness.app.MainActivity || am start -n com.dsh.client/com.deepseekharness.app.MainActivity");
        });

        document.getElementById("btnRefresh").addEventListener("click", updateStatus);

        // 初始化
        updateStatus();
        setInterval(updateStatus, 3000);
    </script>
</body>
</html>
