name: Joint Release (APK + Magisk Module)

on:
  push:
    tags:
      - 'v*'
      - '1.*'
      - '0.1.5rc2*'
      - 'dsha-for-root*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag（例如 0.1.5rc2-u1 或 dsha-for-root-1.0）'
        required: false
        default: '0.1.5rc2-u1'
      prerelease:
        description: '标记为预发布'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build Joint Release (magisk-apk + dsh-magisk)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # 1. 严格从 magisk-apk 分支检出 APK 源码
      - name: Checkout APK Source (magisk-apk)
        uses: actions/checkout@v4
        with:
          ref: magisk-apk

      # 2. 从 dsh-magisk 分支检出 Magisk 模块源码到子目录
      - name: Checkout Magisk Module Source (dsh-magisk)
        uses: actions/checkout@v4
        with:
          ref: dsh-magisk
          path: magisk_src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 准备 APK 签名密钥（如有）
      - name: Prepare release signing key
        env:
          KS_B64: ${{ secrets.DSHA_KEYSTORE_B64 }}
          KS_PWD: ${{ secrets.DSHA_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.DSHA_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.DSHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KS_B64:-}" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/dsha.keystore"
            echo "DSHA_KEYSTORE=$RUNNER_TEMP/dsha.keystore" >> "$GITHUB_ENV"
            echo "DSHA_KEYSTORE_PASSWORD=${KS_PWD:-android}" >> "$GITHUB_ENV"
            echo "DSHA_KEY_ALIAS=${KS_ALIAS:-androiddebugkey}" >> "$GITHUB_ENV"
            echo "DSHA_KEY_PASSWORD=${KEY_PWD:-android}" >> "$GITHUB_ENV"
            echo "已加载发布签名密钥"
          else
            echo "未配置 DSHA_KEYSTORE_B64，将使用默认 debug 签名"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 严格按照 debug 编译流程构建 APK
      - name: Build Standard Debug APK from magisk-apk
        run: ./gradlew :app:assembleStandardDebug --stacktrace

      # 5. 准备发布资产输出目录与 APK 产物
      - name: Prepare APK Asset
        run: |
          set -euo pipefail
          mkdir -p dist
          ORIG_APK=$(ls app/build/outputs/apk/standard/debug/*.apk | head -1)
          cp "$ORIG_APK" "dist/dsha-for-root-1.0.apk"
          ls -lh dist/dsha-for-root-1.0.apk

      # 6. 打包 Magisk Lite 模块（严格遵守 dsh-magisk 脚本与结构）
      - name: Package Magisk Lite Module
        run: |
          set -euo pipefail
          cd magisk_src/magisk-module
          chmod +x customize.sh service.sh action.sh uninstall.sh scripts/*.sh
          zip -r -9 "$GITHUB_WORKSPACE/dist/dsha_ksu_native_lite.zip" META-INF module.prop customize.sh service.sh action.sh uninstall.sh scripts
          ls -lh "$GITHUB_WORKSPACE/dist/dsha_ksu_native_lite.zip"

      # 7. 下载本地验证底包并打包 Magisk Full 模块
      - name: Download Verified Rootfs & Package Full Module
        run: |
          set -euo pipefail
          BASE_TAG="0.1.5rc1-base"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${BASE_TAG}"
          echo "==> 正在下载 0.1.5rc1-base 的 rootfs.tar.gz..."
          curl -L -f -o "$GITHUB_WORKSPACE/magisk_src/magisk-module/rootfs.tar.gz" "${BASE_URL}/rootfs.tar.gz"

          cd "$GITHUB_WORKSPACE/magisk_src/magisk-module"
          zip -r -0 "$GITHUB_WORKSPACE/dist/dsha_ksu_native_full.zip" META-INF module.prop customize.sh service.sh action.sh uninstall.sh scripts rootfs.tar.gz
          ls -lh "$GITHUB_WORKSPACE/dist/dsha_ksu_native_full.zip"

      # 8. 生成 SHA-256 校验和
      - name: Generate Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum dsha-for-root-1.0.apk | tee dsha-for-root-1.0.apk.sha256
          sha256sum dsha_ksu_native_lite.zip | tee dsha_ksu_native_lite.zip.sha256
          sha256sum dsha_ksu_native_full.zip | tee dsha_ksu_native_full.zip.sha256
          ls -lh

      # 9. 解析发布 Tag
      - name: Resolve Release Tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VAL="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG_VAL="${{ inputs.tag }}"
          else
            TAG_VAL="0.1.5rc2-u1"
          fi
          echo "tag=$TAG_VAL" >> "$GITHUB_OUTPUT"

      # 10. 发布联合 Release
      - name: Publish Joint Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: DSHA ${{ steps.tag.outputs.tag }} (Native Root & Core)
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ## DSHA Native (APK + Magisk 核心) 联合发布包

            本版本为前端控制客户端（`magisk-apk`）与原生 Root 核心模块（`dsh-magisk`）的联合交付版本。

            ### 产物与版本清单：
            1. **`dsha-for-root-1.0.apk`**：
               - 源码分支：`magisk-apk`
               - 版本号：`dsha-for-root 1.0` (versionCode 124)
               - 说明：原生 Root 专用前端外壳（体积 ~17MB，无底包负担，提供 3095 硬件桥与 Web 容器）。
            2. **`dsha_ksu_native_lite.zip`**：
               - 源码分支：`dsh-magisk`
               - 模块版本号：`0.1.5rc2-u1` (versionCode 120)
               - 说明：轻量控制脚本更新包（~27KB），用于已有底包用户的热更新。
            3. **`dsha_ksu_native_full.zip`**：
               - 源码分支：`dsh-magisk`
               - 模块版本号：`0.1.5rc2-u1` (versionCode 120)
               - 说明：完整刷机包（~247MB），内置 Ubuntu ARM64 生产闭包与 7 大插件，开箱即刷。
          files: |
            dist/*
          fail_on_unmatched_files: true
