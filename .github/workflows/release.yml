name: Joint Release (APK + Magisk Module)

on:
  push:
    tags:
      - "v*"
      - "1.*"
      - "0.1.5rc2*"
      - "dsha-for-root*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag（例如 0.1.5rc2-u1 或 dsha-for-root-1.0）"
        required: false
        default: "0.1.5rc2-u1"
      prerelease:
        description: "标记为预发布"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build Joint Release (magisk-apk + dsh-magisk)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # 1. 严格从 magisk-apk 分支检出 APK 源码
      - name: Checkout APK Source (magisk-apk)
        uses: actions/checkout@v4
        with:
          ref: magisk-apk

      # 2. 从 dsh-magisk 分支检出 Magisk 模块源码到子目录
      - name: Checkout Magisk Module Source (dsh-magisk)
        uses: actions/checkout@v4
        with:
          ref: dsh-magisk
          path: magisk_src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 准备 APK 签名密钥（如有）
      - name: Prepare release signing key
        env:
          KS_B64: ${{ secrets.DSHA_KEYSTORE_B64 }}
          KS_PWD: ${{ secrets.DSHA_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.DSHA_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.DSHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KS_B64:-}" ]; then
            printf "%s" "$KS_B64" | base64 -d > "$RUNNER_TEMP/dsha.keystore"
            echo "DSHA_KEYSTORE=$RUNNER_TEMP/dsha.keystore" >> "$GITHUB_ENV"
            echo "DSHA_KEYSTORE_PASSWORD=${KS_PWD:-android}" >> "$GITHUB_ENV"
            echo "DSHA_KEY_ALIAS=${KS_ALIAS:-androiddebugkey}" >> "$GITHUB_ENV"
            echo "DSHA_KEY_PASSWORD=${KEY_PWD:-android}" >> "$GITHUB_ENV"
            echo "已加载发布签名密钥"
          else
            echo "未配置 DSHA_KEYSTORE_B64，将使用默认 debug 签名"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 构建 APK（与日常构建完全同一命令）
      - name: Build Standard Debug APK from magisk-apk
        run: ./gradlew :app:assembleStandardDebug --stacktrace

      # 5. 准备发布资产输出目录与 APK 产物
      - name: Prepare APK Asset
        run: |
          set -euo pipefail
          mkdir -p dist
          ORIG_APK=$(ls app/build/outputs/apk/standard/debug/*.apk | head -1)
          cp "$ORIG_APK" "dist/dsha-for-root-1.0.apk"
          ls -lh dist/dsha-for-root-1.0.apk

      # 6. 【核心统一】：模块构建直接调用 dsh-magisk 的统一打包脚本 build-module.sh！
      - name: Build Magisk Lite & Full Modules via build-module.sh
        run: |
          set -euo pipefail
          cd magisk_src
          chmod +x scripts/*.sh tools/*.sh magisk-module/*.sh magisk-module/scripts/*.sh 2>/dev/null || true
          
          echo "==> [1/2] 统一打包 Lite 模块..."
          ./scripts/build-module.sh --lite
          
          echo "==> [2/2] 统一运行动态层叠引擎打包 Full 模块..."
          ./scripts/build-module.sh full
          
          cp -f dist/dsha_ksu_native_lite.zip "$GITHUB_WORKSPACE/dist/"
          cp -f dist/dsha_ksu_native_full.zip "$GITHUB_WORKSPACE/dist/"
          cd "$GITHUB_WORKSPACE"
          ls -lh dist/

      # 7. 生成 SHA-256 校验和
      - name: Generate Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum dsha-for-root-1.0.apk | tee dsha-for-root-1.0.apk.sha256
          sha256sum dsha_ksu_native_lite.zip | tee dsha_ksu_native_lite.zip.sha256
          sha256sum dsha_ksu_native_full.zip | tee dsha_ksu_native_full.zip.sha256
          ls -lh

      # 8. 解析发布 Tag 并创建 GitHub Release
      - name: Resolve Release Tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VAL="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG_VAL="${{ inputs.tag }}"
          else
            TAG_VAL="0.1.5rc2-u1"
          fi
          echo "tag=$TAG_VAL" >> "$GITHUB_OUTPUT"

      - name: Publish Joint Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: DSHA ${{ steps.tag.outputs.tag }} (Native Root & Core)
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ## DSHA Native (APK + Magisk 核心) 联合发布包

            本版本为前端控制客户端（`magisk-apk`）与原生 Root 核心模块（`dsh-magisk`）的联合交付版本。

            ### 产物与版本清单：
            1. **`dsha-for-root-1.0.apk`**：
               - 源码分支：`magisk-apk`
               - 说明：原生 Root 专用前端外壳（体积 ~5.5MB，无底包负担，提供 3095 硬件桥与 Web 容器）。
            2. **`dsha_ksu_native_lite.zip`**：
               - 源码分支：`dsh-magisk`
               - 说明：极速热更新补丁包（~13KB），两步音量键交互，用于已有底包用户的现场补丁热更新。
            3. **`dsha_ksu_native_full.zip`**：
               - 源码分支：`dsh-magisk`
               - 说明：全内置完整刷机包（~215MB），内置 Ubuntu ARM64 生产闭包与四大核心插件，开箱即刷。
          files: |
            dist/*
          fail_on_unmatched_files: true
