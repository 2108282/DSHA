name: Build KernelSU / Magisk Module

on:
  push:
    branches:
      - "dsh-magisk"
  workflow_dispatch:

concurrency:
  group: build-magisk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package Magisk/KernelSU Native Module
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: 检出仓库最新源码
        uses: actions/checkout@v4

      - name: 准备脚本执行权限
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh tools/*.sh magisk-module/*.sh magisk-module/scripts/*.sh 2>/dev/null || true

      - name: 统一编译与打包极速热更新包 (Lite Module)
        run: |
          set -euo pipefail
          ./scripts/build-module.sh --lite

      - name: 上传极速热更新包产物 (Lite Module)
        uses: actions/upload-artifact@v4
        with:
          name: dsha_ksu_native_lite
          path: dist/dsha_ksu_native_lite.zip

      - name: 统一运行动态层叠引擎合成底包并打包全内置刷机包 (Full Module)
        run: |
          set -euo pipefail
          ./scripts/build-module.sh full

      - name: 上传全内置完整刷机包 (Direct Flashable Full Module)
        uses: actions/upload-artifact@v4
        with:
          name: dsha_ksu_native_full
          path: dist/dsha_ksu_native_full.zip
