name: Build KernelSU / Magisk Module

on:
  push:
    branches:
      - 'dsh-magisk'
  workflow_dispatch:

concurrency:
  group: build-magisk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package Magisk/KernelSU Native Module
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: 检出仓库最新源码
        uses: actions/checkout@v4

      - name: 准备模块控制脚本与执行权限
        run: |
          set -euo pipefail
          cd magisk-module
          chmod +x customize.sh service.sh action.sh uninstall.sh scripts/*.sh
          cd ..
          chmod +x scripts/*.sh tools/*.sh

      - name: 下载纯净基准原料底座
        run: |
          set -euo pipefail
          BASE_TAG="0.1.5rc.2-base"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${BASE_TAG}"
          echo "==> 从云端 Release 下载纯净底包原料 (0.1.5rc.2-base)..."
          curl -L -f -o /tmp/raw_rootfs.tar.gz "${BASE_URL}/rootfs.tar.gz"
          ls -lh /tmp/raw_rootfs.tar.gz

      - name: 运行反射式动态层叠引擎合成最新底包
        run: |
          set -euo pipefail
          bash tools/dynamic-rootfs-merge.sh /tmp/raw_rootfs.tar.gz rootfs-overlay "$GITHUB_WORKSPACE/magisk-module/rootfs.tar.gz"

      - name: 发布全新纯净底包至 Release 与持久化同步分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/publish-rootfs-asset.sh "$GITHUB_WORKSPACE/magisk-module/rootfs.tar.gz" 0.1.5rc.2-base 0.1.5rc.2底包

      - name: 上传全内置完整刷机包 (Direct Flashable Full Module)
        uses: actions/upload-artifact@v4
        with:
          name: dsha_ksu_native_full
          path: |
            magisk-module/META-INF
            magisk-module/module.prop
            magisk-module/customize.sh
            magisk-module/service.sh
            magisk-module/action.sh
            magisk-module/uninstall.sh
            magisk-module/scripts
            magisk-module/rootfs.tar.gz
