name: Build KernelSU / Magisk Module

on:
  push:
    branches:
      - 'dsh-magisk'
  workflow_dispatch:

concurrency:
  group: build-magisk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package Magisk/KernelSU Native Module
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Module Files & Permissions
        run: |
          set -euo pipefail
          cd magisk-module
          chmod +x customize.sh service.sh action.sh uninstall.sh scripts/*.sh

      - name: Upload Flashable Lite Module (Direct Flashable)
        uses: actions/upload-artifact@v4
        with:
          name: dsha_ksu_native_lite
          path: |
            magisk-module/META-INF
            magisk-module/module.prop
            magisk-module/customize.sh
            magisk-module/service.sh
            magisk-module/action.sh
            magisk-module/uninstall.sh
            magisk-module/scripts
            magisk-module/builtin-plugins
            magisk-module/plugin-src.tar.gz

      - name: Download Verified Local Rootfs Asset from Release
        run: |
          set -euo pipefail
          BASE_TAG="0.1.5rc1-base"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${BASE_TAG}"
          echo "==> 直接下载手机本地验证通过的完整 249MB rootfs.tar.gz 底包..."
          
          curl -L -f -o "$GITHUB_WORKSPACE/magisk-module/rootfs.tar.gz" "${BASE_URL}/rootfs.tar.gz"
          
          echo "✓ 完整本地底包下载完毕，零二次拼凑："
          ls -lh "$GITHUB_WORKSPACE/magisk-module/rootfs.tar.gz"

      - name: Upload Flashable Full Module (With Verified Local Rootfs, Direct Flashable)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dsha_ksu_native_full
          path: |
            magisk-module/META-INF
            magisk-module/module.prop
            magisk-module/customize.sh
            magisk-module/service.sh
            magisk-module/action.sh
            magisk-module/uninstall.sh
            magisk-module/scripts
            magisk-module/builtin-plugins
            magisk-module/plugin-src.tar.gz
            magisk-module/rootfs.tar.gz
