name: Fast checks

# 秒级、离线、不占 arm64 runner 的检查都放这里。
# 刻意与 android-build.yml 分开：那条流水线要抢 arm64 runner 和 rootfs cache，
# 还跟 release 互相排队，不适合承担快速反馈。
#
# ---------- Job 1：runtime 增量更新清单的守门人 ----------
#
# 为什么值得一条独立 workflow：清单（runtime-manifest.json）与 assets 里的脚本
# 是「同一份事实的两处记录」——本项目反复栽在这个模式上。清单落后于文件时，
# 客户端 RuntimeUpdater 的行为是：
#     本地 hash ≠ 清单 hash → 判定有更新 → 下载 → 校验下载内容是否等于清单 hash
# 下载到的是仓库里的新文件，校验目标却是清单里的旧值，**永远不符 → 整批丢弃**，
# 而且界面上什么都不显示。脚本层热更新对所有用户静默失效，没人会发现。
# 2026-08-25 真出过一次（952c3e1 提交 selftest.py 未带清单）。
#
# 跑在 ubuntu-latest、秒级完成，刻意不放进 android-build.yml：那条流水线要抢
# arm64 runner 和 rootfs cache，和 release 互相排队，不适合承担快速反馈的活。

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: fast-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    name: runtime 清单一致性
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 清单是否与 assets 脚本一致
        run: |
          set -uo pipefail
          if python3 tools/gen-runtime-manifest.py --check; then
            exit 0
          fi
          echo "::error title=runtime 清单落后于 assets::清单里的 sha256 与仓库文件不符。这会让脚本层热更新对所有用户静默失效（下载到新文件、校验旧哈希、整批丢弃、界面无提示）。修复：在仓库根目录跑 python3 tools/gen-runtime-manifest.py && bash tools/sign-runtime-manifest.sh，然后把 runtime-manifest.json 与 runtime-manifest.sig 一起提交。"
          exit 1

      - name: 清单签名是否仍然匹配
        # 只用仓库内置的公钥做离线验签，不需要任何 secret。
        # 抓的是比漏提交更隐蔽的一种错：清单更新了但忘了重签 —— 客户端
        # verifyManifest 不过会整批拒绝，比 hash 不符更彻底，且同样无提示。
        run: |
          set -uo pipefail
          PUB=app/src/main/assets/runtime-update-pubkey.pem
          if [ ! -f runtime-manifest.sig ] || [ ! -f "$PUB" ]; then
            echo "::warning::缺少 runtime-manifest.sig 或内置公钥，跳过验签"
            exit 0
          fi
          RAW=$(mktemp)
          base64 -d < runtime-manifest.sig > "$RAW"
          if openssl dgst -sha256 -verify "$PUB" -signature "$RAW" runtime-manifest.json; then
            echo "清单签名有效"
          else
            echo "::error title=清单签名不匹配::runtime-manifest.sig 不是当前 runtime-manifest.json 的签名，客户端会拒绝整批更新。修复：bash tools/sign-runtime-manifest.sh 重签后一起提交。"
            rm -f "$RAW"
            exit 1
          fi
          rm -f "$RAW"

  # ---------- Job 2：无 Android 依赖的纯逻辑 ----------
  # LanAuth（凭据判定 / 请求行改写）和 AssetPath（清单 asset 名当路径用之前的校验）
  # 全是手写字符串处理，出错时症状隔着一层：「页面能打开但一直转圈」= WebSocket 401、
  # 「打不开」= 后端收到畸形请求行 400、asset 名带 ../ = 文件静静落到私有目录别处。
  # 这些类刻意不碰 Android API，javac 编几个文件就能跑完断言。
  pure-logic:
    name: 纯逻辑断言（LanAuth / AssetPath）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 跑纯逻辑断言集
        run: bash tools/pure-logic-test.sh

      - name: 停止判据端到端（造真进程 + pid 文件，跑一遍 shell 片段）
        # 放这个 job 是因为它要 javac（上一步已经 setup-java 了）。
        # 为什么不能只靠纯逻辑断言：停止功能改坏过三轮，每轮「看代码都对」但真机毫无
        # 作用 —— 病根在环境（/proc/net/tcp 非 root 读不到、/proc 只见同 uid），
        # 字符串拼对了的片段照样可能全程返回空。所以这条真的起进程、真的写 pid 文件。
        run: bash tools/stop-proc-test.sh

      - name: 解压往返（真实代码解真 tar.gz，逐个比 sha256）
        # 首次解压是核心路径（几百 MB rootfs，解坏了用户环境直接废），而这段代码里
        # 读写缓冲、GZIP 缓冲、长文件名、软链、块对齐都容易被「顺手优化」碰坏。
        # 给 android.system.Os 写个 stub，于是 TarGzipExtractor.java 一个字符都不用改
        # 就能在桌面 JVM 上跑 —— 测的是真代码。
        run: bash tools/extract-roundtrip-test.sh

  # ---------- Job 3：assets 脚本层「能不能跑起来」 ----------
  # assets 下的 .py/.sh/.js 是唯一的远程代码通道（runtime 增量更新会把它们推给
  # 所有已安装用户），却不经过 gradle、没有编译期检查。一个写错的正则就能让整个
  # 功能哑火：selftest.py 的 PENDING_RE 曾把 raw string 里的 \( 写成 \\( ——
  # 模块级 re.compile 直接抛 re.error，`python3 selftest.py` 一启动就退出，
  # 而「让用户跑自检把报告贴过来」是排查问题的第一步。ast 语法检查看不出这种错。
  scripts:
    name: assets 脚本自检
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 语法 + 字面量正则 + shell/js 检查
        run: python3 tools/check-asset-scripts.py

      - name: selftest 的插件硬依赖修补断言
        # 这一项会改用户 rootfs 里的插件源码，改错的代价是把「插件不激活」
        # 变成「插件一跑就炸」，必须有断言兜着。
        run: python3 tools/selftest-heal-test.py

      - name: 分范围恢复断言（部分备份绝不能被当成全量恢复）
        # 全量恢复的做法是「整个 .dsh 挪走再换上包里的」。拿一个只含对话的包那么干
        # 就会把配置、凭据、插件声明一起换掉 —— 原数据虽在 .pre-restore-* 里，但用户
        # 看到 RESTORE_OK 不会去找。这条直接跑 restore-merge.py，不需要设备。
        run: bash tools/restore-scope-test.sh


