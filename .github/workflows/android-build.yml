name: Build Android APK

on:
  push:
    branches:
      - 'magisk-apk'
      - 'dsha-fr-apk'
      - '1.2.0-rc1.3test'
      - '1.2.0rc1test'
      - '0.1.5rc.2底包'
      - 'test'
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Standard Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Standard Debug and Release APK
        run: ./gradlew :app:assembleStandardDebug :app:assembleStandardRelease --stacktrace

      - name: Verify APK size and contents
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/standard/*/*.apk
          unzip -l app/build/outputs/apk/standard/release/*.apk | head -20 || true

      - name: Upload Standard Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dsha-standard-debug-full
          path: app/build/outputs/apk/standard/debug/*.apk

      - name: Upload Standard Release APK
        uses: actions/upload-artifact@v4
        with:
          name: dsha-standard-release-v0.1.5rc.2-u2.5
          path: app/build/outputs/apk/standard/release/*.apk
