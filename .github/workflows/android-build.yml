name: Build Android APK

on:
  push:
    branches:
      - '1.2.0-rc1.3test'
      - '1.2.0rc1test'
      - '0.1.5rc.2底包'
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Standard Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and rebuild offline rootfs with dsh 0.1.5-rc.2
        run: |
          set -euo pipefail
          if [ ! -f "app/src/main/assets/offline-rootfs.bin" ]; then
            echo "==> 1. 从用户自己仓库已有的 Release (1.2.0-rc1.3-test1) 下载基础 rootfs..."
            curl -L -f -o /tmp/dsha-base.apk "https://github.com/${{ github.repository }}/releases/download/1.2.0-rc1.3-test1/dsha-standard-1.2.0-rc1.3-test1.apk"
            unzip -p /tmp/dsha-base.apk "assets/offline-rootfs.bin" > /tmp/base-rootfs.bin
            rm -f /tmp/dsha-base.apk

            echo "==> 2. 安装锁定的指定版本 @deepseek-ai/dsh@0.1.5-rc.2 依赖树..."
            mkdir -p /tmp/dsh-stage
            npm install -g --prefix /tmp/dsh-stage @deepseek-ai/dsh@0.1.5-rc.2 --os=linux --cpu=arm64 --libc=glibc --ignore-scripts --no-audit --no-fund

            echo "==> 3. 使用 tools/rebuild-dsh.py 换装，生成出厂内置 0.1.5-rc.2 的 offline-rootfs.bin..."
            python3 tools/rebuild-dsh.py /tmp/base-rootfs.bin app/src/main/assets/offline-rootfs.bin /tmp/dsh-stage/lib/node_modules/@deepseek-ai/dsh
            rm -rf /tmp/base-rootfs.bin /tmp/dsh-stage
          fi
          ls -lh app/src/main/assets/offline-rootfs.bin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Standard Debug APK
        run: ./gradlew :app:assembleStandardDebug --stacktrace

      - name: Verify APK size and contents
        run: |
          set -euo pipefail
          APK_FILE=$(ls app/build/outputs/apk/standard/debug/*.apk | head -1)
          ls -lh "$APK_FILE"
          unzip -l "$APK_FILE" | grep "offline-rootfs" || true

      - name: Upload Standard Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dsha-standard-debug-full
          path: app/build/outputs/apk/standard/debug/*.apk

      - name: Upload Rebuilt offline-rootfs.bin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsha-offline-rootfs-0.1.5-rc.2
          path: app/src/main/assets/offline-rootfs.bin
