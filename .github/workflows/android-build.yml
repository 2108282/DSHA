name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # ===== 从 Release 下载离线包 =====
      - name: Download offline rootfs bundle from Release
        run: |
          set -e
          mkdir -p bundle
          # 尝试从最新 Release 下载已构建好的离线包
          # 你第一次需要手动构建并上传到 Release（见 scripts/make-offline-bundle.sh）
          DOWNLOAD_URL=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | python3 -c "
import json,sys
d=json.load(sys.stdin)
for a in d.get('assets',[]):
    if a['name'] == 'offline-rootfs.tar.gz':
        print(a['browser_download_url'])
        break
" 2>/dev/null || true)
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "❌ 未找到 Release 中的离线包 offline-rootfs.tar.gz"
            echo ""
            echo "首次构建需要你手动在手机上跑一次："
            echo "  1. 在 Termux 中执行: bash scripts/make-offline-bundle.sh"
            echo "  2. 产物: ~/offline-rootfs.tar.gz"
            echo "  3. 上传到 Release:"
            echo "     https://github.com/\${{ github.repository }}/releases/new"
            echo "     Tag: v1.1.0-offline-bundle"
            echo "     附件: offline-rootfs.tar.gz"
            echo ""
            echo "上传后重新触发 CI 即可。"
            exit 1
          else
            echo "下载离线包: $DOWNLOAD_URL"
            curl -fsSL -o bundle/offline-rootfs.tar.gz "$DOWNLOAD_URL"
            ls -lh bundle/offline-rootfs.tar.gz
          fi

      - name: Bundle asset into app
        run: |
          mkdir -p app/src/main/assets
          cp bundle/offline-rootfs.tar.gz app/src/main/assets/offline-rootfs.tar.gz

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsha-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
