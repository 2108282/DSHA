name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # ===== 1. 用 qemu 在 arm64 Ubuntu 内预装 deepseek-harness =====
      - name: Enable arm64 binfmt
        run: |
          docker run --rm --privileged tonistiigi/binfmt --install arm64

      - name: Build offline rootfs bundle (provisioned, ready-to-use)
        run: |
          set -e
          mkdir -p bundle
          # 用多架构 arm64 容器承载预装(rootfs 内容即容器文件系统)
          docker create --platform linux/arm64 --name dshprovision arm64v8/ubuntu:24.04
          docker start dshprovision
          # 注入补丁素材 + 预装脚本
          docker exec dshprovision bash -c "mkdir -p /root/patches"
          for f in webui-sidebar.patch bash-guard.patch webui-polyfill.sh rootfs-confirm-install.sh; do
            docker cp "app/src/main/assets/$f" "dshprovision:/root/patches/$f"
          done
          docker cp scripts/offline-provision.sh dshprovision:/root/offline-provision.sh
          docker exec dshprovision bash /root/offline-provision.sh

          # 预处理：移除容器仅内建、App 不需要的东西，并写入 host resolv.conf
          docker exec dshprovision bash -c "rm -f /root/offline-provision.sh; \
            rm -rf /root/.cache npm 日志 /var/lib/apt/lists /tmp/* 2>/dev/null || true"

          # 导出为 rootfs tar.gz（顶层 . 即 / 根，与 App 解压目标一致）
          docker export dshprovision | gzip > bundle/offline-rootfs.tar.gz
          docker rm -f dshprovision
          ls -lh bundle/offline-rootfs.tar.gz

      # ===== 2. 放进 app assets(构建时的离线包)=====
      - name: Bundle asset into app
        run: |
          mkdir -p app/src/main/assets
          cp bundle/offline-rootfs.tar.gz app/src/main/assets/offline-rootfs.tar.gz

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: |
          # CI 为 x86_64,移除仅适用于本地 ARM64 的 aapt2 路径覆盖
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsha-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: offline-rootfs-bundle
          path: bundle/offline-rootfs.tar.gz
