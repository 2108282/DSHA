name: Build Debug APK

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1：原生 arm64 预装 rootfs（node-pty 必须编 arm64）。
  # 不在这里装 Android SDK —— ARM runner 上 setup-android 会失败。
  bundle:
    name: Offline rootfs (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached offline bundle
        id: cache
        uses: actions/cache@v4
        with:
          path: bundle/offline-rootfs.tar.gz
          key: offline-rootfs-${{ hashFiles('scripts/offline-provision.sh', 'scripts/ci-make-offline-bundle.sh', 'scripts/provision-builtin-plugins.sh', 'app/src/main/assets/rootfs-confirm-install.sh', 'app/src/main/assets/webui-polyfill.sh', 'app/src/main/assets/*.patch', 'app/src/main/assets/mobile-adapt/**', 'app/src/main/assets/device-shell-guide/**', 'app/src/main/assets/task-notifier/**') }}

      - name: Build offline rootfs bundle
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p bundle
          bash scripts/ci-make-offline-bundle.sh
          test -s bundle/offline-rootfs.tar.gz
          ls -lh bundle/offline-rootfs.tar.gz

# 离线包版本标记：与 App 内置包同步 bump（可用 OFFLINE_VERSION env 覆盖）。
# 默认 1 = 首次 CI 重建离线包（含预置内置插件）→ 老用户（rootfs 无标记=0）
# 会收到一次升级提示；之后内容再变时 bump 2、3… 才再次提示。
# 注意：本地 build.sh 不重建离线包，assets 里默认 version=0 保证不误弹。
# 缓存命中时也要生成（缓存只存 tar.gz，version 需每次生成）。
      - name: Write offline version
        run: |
          set -euo pipefail
          VER="${OFFLINE_VERSION:-1}"
          printf '%s\n' "$VER" > bundle/offline-rootfs.version
          echo "offline-rootfs.version=$VER"

      - name: Upload offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: offline-rootfs-bundle
          path: |
            bundle/offline-rootfs.tar.gz
            bundle/offline-rootfs.version
          if-no-files-found: error
          retention-days: 14

  # Job 2：x86 runner 打 APK（官方 aapt2 只有 x86_64）
  apk:
    name: Assemble debug APK
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download offline bundle
        uses: actions/download-artifact@v4
        with:
          name: offline-rootfs-bundle
          path: bundle

      - name: Bundle asset into app
        run: |
          set -euo pipefail
          test -s bundle/offline-rootfs.tar.gz
          mkdir -p app/src/main/assets
          cp bundle/offline-rootfs.tar.gz app/src/main/assets/offline-rootfs.tar.gz
          # 离线包版本标记（App 启动时对比 rootfs 已解压版本，发现新版提示升级）
          if [ -f bundle/offline-rootfs.version ]; then
            cp bundle/offline-rootfs.version app/src/main/assets/offline-rootfs.version
          fi
          ls -lh app/src/main/assets/offline-rootfs.tar.gz app/src/main/assets/offline-rootfs.version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: |
          set -euo pipefail
          # CI 是 x86_64：去掉仅适用于本地 ARM64 的 aapt2 覆盖
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          gradle :app:assembleDebug --no-daemon
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsha-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
