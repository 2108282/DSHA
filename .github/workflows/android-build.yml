name: Build Debug APK

on:
  push:
    branches: [main, 'feat/**', 'arena/**']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and extract offline bundle from official release APK
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          echo "正在下载官方最新发布版 APK..."
          URL="https://github.com/qiannianhuanxiang/DSHA/releases/download/v1.2.0-alpha.2/dsha-1.2.0-alpha.2-vc104.apk"
          if ! curl -fL --retry 3 --connect-timeout 30 -o /tmp/dsha-release.apk "$URL"; then
            echo "尝试备用下载地址..."
            curl -fL --retry 3 --connect-timeout 30 -o /tmp/dsha-release.apk \
              https://github.com/qiannianhuanxiang/DSHA/releases/download/v1.1.9.1/deepseekharness-arm64-v1.1.9.1.apk
          fi
          echo "正在精确解压提取 offline-rootfs..."
          if unzip -l /tmp/dsha-release.apk "assets/offline-rootfs.bin" >/dev/null 2>&1; then
            unzip -p /tmp/dsha-release.apk "assets/offline-rootfs.bin" > app/src/main/assets/offline-rootfs.tar.gz
          elif unzip -l /tmp/dsha-release.apk "assets/offline-rootfs.tar.gz" >/dev/null 2>&1; then
            unzip -p /tmp/dsha-release.apk "assets/offline-rootfs.tar.gz" > app/src/main/assets/offline-rootfs.tar.gz
          fi
          if unzip -l /tmp/dsha-release.apk "assets/offline-rootfs.version" >/dev/null 2>&1; then
            unzip -p /tmp/dsha-release.apk "assets/offline-rootfs.version" > app/src/main/assets/offline-rootfs.version
          else
            echo "5" > app/src/main/assets/offline-rootfs.version
          fi
          rm -f /tmp/dsha-release.apk
          test -s app/src/main/assets/offline-rootfs.tar.gz
          ls -lh app/src/main/assets/offline-rootfs.*

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Prepare shared signing key (optional)
        env:
          KS_B64: ${{ secrets.DSHA_KEYSTORE_B64 }}
          KS_PWD: ${{ secrets.DSHA_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.DSHA_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.DSHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KS_B64:-}" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/dsha.keystore"
            echo "DSHA_KEYSTORE=$RUNNER_TEMP/dsha.keystore" >> "$GITHUB_ENV"
            echo "DSHA_KEYSTORE_PASSWORD=${KS_PWD:-android}" >> "$GITHUB_ENV"
            echo "DSHA_KEY_ALIAS=${KS_ALIAS:-dsha}" >> "$GITHUB_ENV"
            echo "DSHA_KEY_PASSWORD=${KEY_PWD:-android}" >> "$GITHUB_ENV"
            echo "已启用统一签名（与历史发布包一致，可直接覆盖安装）"
          else
            echo "未配置 DSHA_KEYSTORE_B64：使用默认 debug 签名（升级可能需要卸载重装）"
          fi

      - name: Build debug APK
        run: |
          set -euo pipefail
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          gradle :app:assembleDebug --no-daemon --stacktrace
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsha-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
