name: Build Android Release APK (No Release Publish)

on:
  push:
    branches:
      - 'magisk-apk'
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed Standard Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 配置 APK 签名密钥（如有 Secret 则加载，无则使用 debug 签名）
        env:
          KS_B64: ${{ secrets.DSHA_KEYSTORE_B64 }}
          KS_PWD: ${{ secrets.DSHA_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.DSHA_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.DSHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KS_B64:-}" ]; then
            printf "%s" "$KS_B64" | base64 -d > "$RUNNER_TEMP/dsha.keystore"
            echo "DSHA_KEYSTORE=$RUNNER_TEMP/dsha.keystore" >> "$GITHUB_ENV"
            echo "DSHA_KEYSTORE_PASSWORD=${KS_PWD:-android}" >> "$GITHUB_ENV"
            echo "DSHA_KEY_ALIAS=${KS_ALIAS:-androiddebugkey}" >> "$GITHUB_ENV"
            echo "DSHA_KEY_PASSWORD=${KEY_PWD:-android}" >> "$GITHUB_ENV"
            echo "已成功加载生产发布签名密钥"
          else
            echo "未检测到 DSHA_KEYSTORE_B64，将按配置使用 Gradle 默认签名"
          fi

      - name: 执行 Release 编译打包 (:app:assembleStandardRelease)
        run: ./gradlew :app:assembleStandardRelease --stacktrace

      - name: 收集与重命名 Release 产物
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_SRC=$(ls app/build/outputs/apk/standard/release/*.apk | head -1)
          cp -f "$APK_SRC" "dist/DSHA-FR-0.1.7-rc.1-release.apk"
          cd dist
          sha256sum "DSHA-FR-0.1.7-rc.1-release.apk" | tee "DSHA-FR-0.1.7-rc.1-release.apk.sha256"
          echo "=========================================================="
          echo "           带签名 Release APK 打包就绪 (不发布)            "
          echo "=========================================================="
          ls -lh
          echo "=========================================================="

      - name: 上传带签名 Release APK 至 Artifacts (仅供下载，不发布)
        uses: actions/upload-artifact@v4
        with:
          name: DSHA-FR-0.1.7-rc.1-release-apk
          path: dist/*
          if-no-files-found: error
