name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # ARM64 原生 runner:预装 rootfs 需要 arm64 本机执行(node-pty 等原生模块编译),
    # 用 x86 qemu 模拟会 OOM(exit 137)。原生 arm64 又快又不占内存。
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # ===== 1. 在原生 arm64 docker 内预装 deepseek-harness =====
      - name: Build offline rootfs bundle (provisioned, ready-to-use)
        run: |
          set -e
          mkdir -p bundle
          # arm64 runner 上 docker 原生执行,不需 qemu(避免 OOM)
          docker create --platform linux/arm64 --name dshprovision arm64v8/ubuntu:24.04
          docker start dshprovision
          docker exec dshprovision bash -c "mkdir -p /root/patches"
          for f in webui-sidebar.patch bash-guard.patch webui-polyfill.sh rootfs-confirm-install.sh; do
            docker cp "app/src/main/assets/$f" "dshprovision:/root/patches/$f"
          done
          docker cp scripts/offline-provision.sh dshprovision:/root/offline-provision.sh
          docker exec dshprovision bash /root/offline-provision.sh

          # 精简:清掉仅构建期需要的大文件
          docker exec dshprovision bash -c "rm -f /root/offline-provision.sh; \
            rm -rf /var/lib/apt/lists /root/.cache /root/.npm /tmp/* 2>/dev/null || true"

          # 导出为 rootfs tar.gz(顶层 . 即 / 根)
          docker export dshprovision | gzip -1 > bundle/offline-rootfs.tar.gz
          docker rm -f dshprovision
          ls -lh bundle/offline-rootfs.tar.gz

      # ===== 2. 放进 app assets =====
      - name: Bundle asset into app
        run: |
          mkdir -p app/src/main/assets
          cp bundle/offline-rootfs.tar.gz app/src/main/assets/offline-rootfs.tar.gz

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsha-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: offline-rootfs-bundle
          path: bundle/offline-rootfs.tar.gz
